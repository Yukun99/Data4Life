# Builds the web and backend images and pushes them to the GitHub Container Registry, for Docker
# hosts that can pull images but cannot build them or run Compose.

name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            context: frontend
          - name: backend
            context: backend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}"
          docker build -t "$image:latest" -t "$image:${GITHUB_SHA::7}" "${{ matrix.context }}"
          docker push --all-tags "$image"
